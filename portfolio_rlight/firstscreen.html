<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-Light | Masuk ke Ruang Cahaya</title>

    <!-- Tipografi Handwritten: Caveat (Display), Patrick Hand (Body), Architects Daughter (Catatan) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Stylesheet Utama -->
    <link rel="stylesheet" href="css/style.css">

    <script>
        (function () {
            try {
                const savedTheme = sessionStorage.getItem('relight_theme');
                if (savedTheme && ['tungsten', 'studio', 'noir'].includes(savedTheme)) {
                    document.documentElement.setAttribute('data-initial-theme', savedTheme);
                }
            } catch (e) {
                // Abaikan jika sessionStorage dibatasi
            }
        })();
    </script>
</head>
<body class="intro-page" data-lighting="tungsten">

    <!-- Motion Graphic: Kanvas Partikel Cahaya & Bokeh Melayang -->
    <canvas class="motion-bg-canvas" id="introMotionCanvas" aria-hidden="true"></canvas>

    <!-- Efek Grain Kertas/Film & Lampu Ambient -->
    <div class="film-grain"></div>
    <div class="ambient-light" id="introAmbientLight"></div>

    <!-- Efek Mekar Cahaya & Tirai Transisi Keluar yang Smooth -->
    <div class="intro-light-bloom" id="introLightBloom" aria-hidden="true"></div>
    <div class="intro-exit-curtain" id="introExitCurtain" aria-hidden="true"></div>

    <!-- ==================================================================== -->
    <!-- TOPBAR MINIMALIS (BRAND & PENGATUR SUHU CAHAYA)                      -->
    <!-- ==================================================================== -->
    <header class="intro-topbar">
        <div class="intro-topbar-inner">
            <div class="brand-link" aria-label="Re-Light Studio">
                <span class="brand-lamp"></span>
                <span class="brand-title" id="introBrandTitle">Re-Light</span>
                <span class="brand-edition" id="introBrandEdition">Portfolio</span>
            </div>

            <!-- Pengatur Suhu Cahaya (Sinkron ke Tampilan Utama) -->
            <div class="lighting-control" role="group" aria-label="Mode Pencahayaan">
                <span style="opacity: 0.7; display:flex; align-items:center;"><i data-lucide="sun-medium" size="14"></i></span>
                <button type="button" class="light-option active" data-theme="tungsten" onclick="setIntroLighting('tungsten', this)">Tungsten</button>
                <button type="button" class="light-option" data-theme="studio" onclick="setIntroLighting('studio', this)">Studio</button>
                <button type="button" class="light-option" data-theme="noir" onclick="setIntroLighting('noir', this)">Noir</button>
            </div>
        </div>
    </header>

    <!-- ==================================================================== -->
    <!-- PANGGUNG PEMBUKA RE-LIGHT                                            -->
    <!-- ==================================================================== -->
    <main class="intro-main">
        <section class="intro-stage" id="introStage" aria-label="Layar Pembuka Portofolio">
            <!-- Bingkai Sudut Viewfinder Ruang Gelap -->
            <span class="intro-corner tl" aria-hidden="true"></span>
            <span class="intro-corner tr" aria-hidden="true"></span>
            <span class="intro-corner bl" aria-hidden="true"></span>
            <span class="intro-corner br" aria-hidden="true"></span>

            <div class="intro-stage-content">
                <!-- Lampu Filamen Tulis Tangan (Mengikuti Gaya Hero Utama) -->
                <div class="intro-bulb-wrap" aria-hidden="true">
                    <div class="intro-bulb-aura"></div>
                    <svg class="sketch-bulb-svg intro-bulb-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g class="bulb-rays">
                            <path class="draw-path" d="M60 8 L60 22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                            <path class="draw-path" d="M24 23 L34 33" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                            <path class="draw-path" d="M96 23 L86 33" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                            <path class="draw-path" d="M10 56 L24 56" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                            <path class="draw-path" d="M110 56 L96 56" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        </g>
                        <path class="bulb-glass draw-path" d="M43 72 C34 65 32 50 38 40 C44 30 56 26 68 30 C80 34 86 48 82 60 C79 68 74 71 71 78 L49 78 C47 74 45 73 43 72 Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path class="bulb-filament" d="M54 78 L54 58 C54 53 58 51 60 56 C62 51 66 53 66 58 L66 78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path class="draw-path" d="M50 85 L70 85 M52 92 L68 92 M56 99 L64 99" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- Label Meta -->
                <div class="hero-meta intro-meta">
                    <span id="introMetaBadge">Arsip Visual</span>
                    <span>•</span>
                    <span id="introCreatorName">Raifan</span>
                </div>

                <!-- Judul Utama Tampilan Awal -->
                <h1 class="intro-title">
                    <span>Di balik ruang gelap,</span>
                    <span class="hero-emphasis-wrap">
                        <em>nyalakan cahaya.</em>
                        <svg class="hero-underline-svg" viewBox="0 0 360 28" preserveAspectRatio="none" aria-hidden="true">
                            <path class="underline-stroke" d="M4 18 C 75 6, 185 24, 354 10" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
                            <path class="underline-stroke secondary" d="M22 24 C 120 15, 220 26, 330 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                    </span>
                </h1>

                <!-- Kutipan Pengantar -->
                <p class="intro-quote" id="introQuoteDisplay">
                    In The Name of Light, Who Fight the Darkness, Create the Shadow.
                </p>

                <!-- Tombol Sakelar Re-Light untuk Masuk -->
                <div class="intro-cta-wrap">
                    <button type="button" class="intro-ignite-btn interactive-sheen" id="enterStudioBtn" onclick="enterMainPortfolio()">
                        <span class="ignite-switch-dot" aria-hidden="true"></span>
                        <span class="ignite-btn-label">Nyalakan Cahaya</span>
                        <span class="ignite-btn-sep" aria-hidden="true">•</span>
                        <span class="ignite-btn-action">Masuk</span>
                        <i data-lucide="arrow-right" size="16" class="ignite-btn-arrow"></i>
                    </button>
                </div>

                <!-- Ringkasan Arsip & Petunjuk Keyboard -->
                <div class="intro-archive-strip">
                    <span id="introArchiveSummary">Desain • Sketsa • Fotografi • Catatan • Musik</span>
                    <span class="intro-key-hint">Klik tombol atau tekan <kbd>Enter</kbd></span>
                </div>
            </div>
        </section>
    </main>

    <!-- Data Konten Utama agar Selalu Sinkron -->
    <script src="content/1_teks_utama.js"></script>
    <script src="content/2_profil_saya.js"></script>
    <script src="content/3_karya_desain.js"></script>
    <script src="content/4_karya_sketsa.js"></script>
    <script src="content/5_karya_fotografi.js"></script>

    <!-- Logika Layar Pembuka & Transisi ke Halaman Utama -->
    <script src="js/firstscreen.js"></script>
</body>
</html>
